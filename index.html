
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emiliano's 18th Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
 
  <main class="wrap">
 
    <header class="hero">
      <p class="eyebrow">You're invited to</p>
      <h1 class="name">Emiliano's</h1>
      <div class="age">18</div>
      <p class="tagline">Birthday Party</p>
    </header>

    <section class="countdown" aria-label="Countdown to the party">
      <div class="unit"><span id="days">00</span><small>Days</small></div>
      <div class="unit"><span id="hours">00</span><small>Hours</small></div>
      <div class="unit"><span id="minutes">00</span><small>Min</small></div>
      <div class="unit"><span id="seconds">00</span><small>Sec</small></div>
    </section>
 
    <section class="info">
      <div class="info-item">
        <small>Date</small>
        <strong>Saturday, Nov 21</strong>
      </div>
      <div class="info-item">
        <small>Time</small>
        <strong>4:30 PM</strong>
      </div>
      <div class="info-item">
        <small>Where</small>
        <strong>7315 Gingersnap Dr., Corona CA</strong>
      </div>
    </section>
 
    <a href="#" class="rsvp" id="rsvp-link" target="_blank" rel="noopener">RSVP</a>
 
  </main>
 
  <script src="script.js"></script>
</body>
</html>
